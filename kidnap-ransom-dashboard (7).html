<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kidnap &amp; Ransom Exposure &amp; Underwriting Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0A1728; --bgPanel:#0F2038; --bgPanelAlt:#13253F;
    --line:#233A57; --lineSoft:#1A2E4A;
    --gold:#C9A24B; --goldBright:#E8C877; --goldDim:#8A7238;
    --text:#EDE8DA; --textMuted:#8FA2BD; --textFaint:#5C7091;
    --low:#4C9A6A; --moderate:#D6A537; --high:#D97A34; --critical:#C0473F;
    --display: "Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
    --body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--body);
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  #bg-canvas{
    position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;
  }
  .app{ position:relative; z-index:1; }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  select, input{font-family:inherit;}
  ::selection{ background: rgba(201,162,75,0.35); }

  .header{ position:relative; padding:20px 16px 12px; border-bottom:1px solid var(--line); background:rgba(10,23,40,0.55); backdrop-filter: blur(2px); }
  .presenter-toggle-btn{ position:absolute; top:18px; right:16px; display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
    padding:6px 11px; border-radius:999px; color:var(--textMuted); background:var(--bgPanelAlt); border:1px solid var(--line); }
  .presenter-toggle-btn:hover{ color:var(--text); border-color:var(--goldDim); }
  .presenter-toggle-btn.on{ color:var(--goldBright); background:rgba(201,162,75,0.14); border-color:var(--goldDim); }
  .presenter-bar{ position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex; align-items:center; justify-content:center;
    gap:14px; flex-wrap:wrap; padding:10px 16px; background:rgba(10,23,40,0.96); border-top:1px solid var(--goldDim); backdrop-filter:blur(6px); }
  .presenter-bar .step-label{ font-size:11px; color:var(--textMuted); font-family:var(--mono); min-width:120px; text-align:center; }
  .presenter-nav-btn{ display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; padding:7px 14px; border-radius:6px;
    color:var(--text); background:var(--bgPanelAlt); border:1px solid var(--line); }
  .presenter-nav-btn:hover:not(:disabled){ border-color:var(--goldDim); color:var(--goldBright); }
  .presenter-nav-btn:disabled{ opacity:.35; cursor:default; }
  .presenter-notes{ position:fixed; right:16px; bottom:60px; z-index:39; width:min(320px, calc(100vw - 32px)); max-height:38vh; overflow-y:auto;
    background:var(--bgPanel); border:1px solid var(--goldDim); border-radius:10px; padding:14px 16px; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
  body.presenter-on .content{ padding-bottom:76px; }
  .header-inner, .content, .tabs-inner{ max-width:1152px; margin:0 auto; width:100%; }
  .eyebrow-top{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .eyebrow-top span{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); }
  h1{ font-family:var(--display); font-size:22px; font-weight:600; margin:2px 0 0; color:var(--text); }
  .subtitle{ font-size:12px; color:var(--textMuted); margin-top:6px; }

  .tabs{ position:sticky; top:0; z-index:10; display:flex; gap:4px; padding:8px 12px; overflow-x:auto;
    border-bottom:1px solid var(--line); background:rgba(10,23,40,0.92); backdrop-filter: blur(6px); }
  .tabs-inner{ display:flex; gap:4px; }
  .tab-btn{ white-space:nowrap; padding:6px 12px; border-radius:6px; font-size:12px; font-weight:500;
    background:transparent; color:var(--textMuted); border:1px solid transparent; transition:.15s; }
  .tab-btn.active{ background:rgba(201,162,75,0.14); color:var(--goldBright); border-color:var(--goldDim); }
  .tab-btn:hover:not(.active){ color:var(--text); }

  .content{ padding:16px 12px; display:flex; flex-direction:column; gap:12px; }
  @media(min-width:768px){ .content{ padding:20px; } }

  .card{ border-radius:10px; padding:16px; background:var(--bgPanel); border:1px solid var(--line); }
  .eyebrow{ font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }
  .muted{ color:var(--textMuted); }
  .faint{ color:var(--textFaint); }
  .mono{ font-family:var(--mono); }

  .grid{ display:grid; gap:8px; }
  .grid-kpi{ grid-template-columns:repeat(2,1fr); }
  @media(min-width:1024px){ .grid-kpi{ grid-template-columns:repeat(5,1fr); } }
  .grid-2{ grid-template-columns:1fr; gap:12px; }
  @media(min-width:768px){ .grid-2{ grid-template-columns:1fr 1fr; } }
  .grid-3{ grid-template-columns:1fr; gap:8px; }
  @media(min-width:640px){ .grid-3{ grid-template-columns:repeat(3,1fr); } }
  .grid-6{ grid-template-columns:repeat(2,1fr); gap:8px; }
  @media(min-width:640px){ .grid-6{ grid-template-columns:repeat(3,1fr); } }

  .kpi-value{ font-family:var(--mono); font-size:22px; font-weight:600; }
  .kpi-sub{ font-size:11px; color:var(--textMuted); margin-top:4px; }

  .toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; border-radius:6px;
    padding:10px 12px; background:var(--bgPanelAlt); border:1px solid var(--line); transition:.15s; }
  .toggle.on{ background:rgba(201,162,75,0.10); border-color:var(--goldDim); }
  .toggle .label{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); }
  .toggle .state{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:2px 8px; border-radius:4px; color:var(--textFaint); }
  .toggle.on .state{ color:var(--gold); background:rgba(201,162,75,0.15); }

  .pill{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; font-family:var(--mono); }

  select, .input{ width:100%; margin-top:4px; font-size:13px; border-radius:6px; padding:7px 8px;
    background:var(--bgPanelAlt); border:1px solid var(--line); color:var(--text); }
  label.small{ font-size:11px; color:var(--textMuted); }
  input[type=range]{ width:100%; accent-color:var(--gold); }

  .btn-ghost{ display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:4px 8px; border-radius:6px;
    color:var(--textMuted); border:1px solid var(--line); background:transparent; }
  .btn-ghost:hover{ color:var(--text); border-color:var(--gold); }

  table{ width:100%; font-size:12px; border-collapse:collapse; }
  th{ text-align:left; padding:6px 8px; color:var(--textFaint); font-weight:600; white-space:nowrap; }
  th button{ background:none; border:none; color:var(--textFaint); font-weight:600; display:flex; align-items:center; gap:4px; font-size:12px; padding:0;}
  td{ padding:6px 8px; }
  tbody tr{ border-bottom:1px solid var(--lineSoft); cursor:pointer; transition:.1s; }
  tbody tr:hover{ background:rgba(201,162,75,0.06); }
  tbody tr.selected{ background:rgba(201,162,75,0.10); }
  .table-wrap{ overflow-x:auto; }

  .search-wrap{ position:relative; flex:1; min-width:160px; }
  .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--textFaint); }
  .search-wrap input{ width:100%; padding-left:28px; }
  .filters{ display:flex; flex-wrap:wrap; gap:8px; }

  .minirow{ display:flex; align-items:center; justify-content:space-between; gap:8px; border-radius:6px;
    padding:8px 12px; background:var(--bgPanelAlt); border:1px solid var(--line); font-size:13px; }

  .ministat{ border-radius:6px; padding:10px; background:var(--bgPanelAlt); border:1px solid var(--line); }
  .ministat .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--textFaint); }
  .ministat .val{ font-size:14px; font-weight:600; font-family:var(--mono); margin-top:2px; }

  .rec-list{ display:flex; flex-direction:column; gap:6px; margin:6px 0 0; padding:0; list-style:none; }
  .rec-list li{ display:flex; gap:8px; font-size:13px; }
  .rec-list svg{ margin-top:3px; flex-shrink:0; }

  .heat-table td{ text-align:center; color:#0A1728; font-family:var(--mono); font-weight:600; border-radius:4px; padding:6px 4px; }
  .heat-table th{ font-size:11px; padding-bottom:4px; }
  .heat-table{ border-collapse:separate; border-spacing:3px; }

  .threat-card .stat-label{ font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--textFaint);
    display:flex; align-items:center; justify-content:center; gap:4px; }
  .threat-card .stat-value{ font-size:14px; font-weight:600; font-family:var(--mono); margin-top:2px; }
  .bar-track{ width:100%; height:6px; border-radius:999px; background:var(--lineSoft); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; background:var(--gold); }

  .chart-box{ width:100%; }
  canvas.chart-canvas{ max-width:100%; }

  .traffic{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  .geo-legend{ display:flex; gap:14px; flex-wrap:wrap; margin:6px 0 2px; }
  .geo-legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--textMuted); }
  .geo-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .geo-map-wrap{ position:relative; margin-top:8px; border-radius:8px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, rgba(35,58,87,0.35), rgba(10,23,40,0) 70%); }
  #geo-svg{ width:100%; height:auto; display:block; }
  .geo-tooltip{ position:absolute; z-index:20; pointer-events:none; opacity:0; transition:opacity .12s;
    background:var(--bgPanelAlt); border:1px solid var(--goldDim); border-radius:6px; padding:8px 10px;
    font-size:11px; line-height:1.45; max-width:220px; box-shadow:0 4px 14px rgba(0,0,0,0.4); color:var(--text); }
  .geo-pulse-ring{ transform-box:fill-box; transform-origin:center; animation:geoPulse 2.4s ease-out infinite; }
  @keyframes geoPulse{ 0%{ transform:scale(1); opacity:0.85; } 100%{ transform:scale(2.8); opacity:0; } }
  .geo-marker-dot{ animation:geoDotGlow 2.4s ease-in-out infinite; }
  @keyframes geoDotGlow{ 0%,100%{ opacity:1; } 50%{ opacity:0.7; } }
  .geo-feed-row{ opacity:0; animation:geoFeedIn .3s ease-out forwards; }
  @keyframes geoFeedIn{ from{ opacity:0; transform:translateY(-4px);} to{ opacity:1; transform:translateY(0);} }

  /* ===================== MINI WORLD MAP (Executive tab widget) ===================== */
  .mini-geo-wrap{ position:relative; margin-top:6px; border-radius:8px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, rgba(35,58,87,0.35), rgba(10,23,40,0) 70%); }
  #mini-geo-svg{ width:100%; height:auto; display:block; }

  /* ===================== AI RISK ADVISOR ===================== */
  .advisor-header{ display:flex; align-items:center; gap:12px; }
  .advisor-avatar{ width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; background:radial-gradient(circle at 32% 28%, var(--goldBright), var(--gold) 55%, var(--goldDim) 100%);
    box-shadow:0 0 0 1px var(--goldDim), 0 2px 10px rgba(201,162,75,0.25); }
  .advisor-name{ font-family:var(--display); font-size:16px; font-weight:600; color:var(--text); }
  .advisor-tagline{ font-size:11.5px; color:var(--textMuted); margin-top:1px; }
  .advisor-status{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--low); margin-left:auto; flex-shrink:0; }
  .advisor-status .dot{ width:7px; height:7px; border-radius:50%; background:var(--low); box-shadow:0 0 6px var(--low); animation:geoDotGlow 2s ease-in-out infinite; }

  .mode-switch{ display:inline-flex; border-radius:999px; padding:2px; background:var(--bgPanelAlt); border:1px solid var(--line); flex-shrink:0; }
  .mode-switch button{ border:none; background:transparent; font-size:11px; font-weight:600; padding:5px 11px; border-radius:999px; color:var(--textMuted); }
  .mode-switch button.on{ background:rgba(201,162,75,0.16); color:var(--goldBright); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-size:11px; padding:5px 10px; border-radius:999px; background:var(--bgPanelAlt); border:1px solid var(--line);
    color:var(--textMuted); transition:.12s; text-align:left; }
  .chip:hover{ color:var(--goldBright); border-color:var(--goldDim); }

  .chat-window{ display:flex; flex-direction:column; gap:12px; padding:14px 4px; max-height:480px; overflow-y:auto; }
  .chat-row{ display:flex; gap:9px; max-width:100%; }
  .chat-row.user{ flex-direction:row-reverse; }
  .chat-avatar{ width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700; margin-top:2px; }
  .chat-avatar.assistant{ background:radial-gradient(circle at 32% 28%, var(--goldBright), var(--goldDim)); color:#20160A; }
  .chat-avatar.user{ background:var(--bgPanelAlt); border:1px solid var(--line); color:var(--textMuted); }
  .chat-bubble{ font-size:13px; line-height:1.55; padding:10px 13px; border-radius:12px; max-width:78%; }
  .chat-row.assistant .chat-bubble{ background:var(--bgPanelAlt); border:1px solid var(--line); border-top-left-radius:3px; }
  .chat-row.user .chat-bubble{ background:rgba(201,162,75,0.13); border:1px solid var(--goldDim); border-top-right-radius:3px; color:var(--text); }
  .chat-bubble p{ margin:0 0 8px; }
  .chat-bubble p:last-child{ margin-bottom:0; }
  .chat-bubble ul{ margin:4px 0 8px; padding-left:18px; }
  .chat-bubble li{ margin-bottom:3px; }
  .chat-bubble strong{ color:var(--goldBright); font-weight:600; }
  .chat-bubble .src-line{ margin-top:6px; padding-top:6px; border-top:1px solid var(--lineSoft); font-size:10.5px; color:var(--textFaint); }

  .typing-dots{ display:inline-flex; gap:3px; align-items:center; padding:2px 0; }
  .typing-dots span{ width:5px; height:5px; border-radius:50%; background:var(--textMuted); animation:typingBounce 1.1s infinite ease-in-out; }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4; } 30%{ transform:translateY(-4px); opacity:1; } }

  .chat-input-row{ display:flex; gap:8px; align-items:flex-end; border-top:1px solid var(--line); padding-top:10px; margin-top:2px; }
  .chat-input-row textarea{ flex:1; resize:none; min-height:40px; max-height:120px; font-size:13px; border-radius:8px;
    padding:9px 11px; background:var(--bgPanelAlt); border:1px solid var(--line); color:var(--text); line-height:1.4; }
  .chat-input-row textarea:focus{ outline:none; border-color:var(--goldDim); }
  .chat-send-btn{ flex-shrink:0; width:40px; height:40px; border-radius:8px; background:var(--gold); border:none;
    display:flex; align-items:center; justify-content:center; color:#1a1206; transition:.12s; }
  .chat-send-btn:hover{ background:var(--goldBright); }
  .chat-send-btn:disabled{ opacity:.45; cursor:default; }
  .chat-disclaimer{ font-size:10.5px; color:var(--textFaint); margin-top:8px; text-align:center; }

  /* ---- Financial Lifecycle wheel ---- */
  .lc-layout{ display:grid; grid-template-columns:1fr; gap:24px; align-items:start; margin-top:18px; }
  @media(min-width:900px){ .lc-layout{ grid-template-columns:340px 1fr; } }
  .lc-wheel-col{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .lc-wheel-wrap{ position:relative; width:300px; height:300px; max-width:100%; flex-shrink:0; }
  .lc-wheel-wrap svg{ width:100%; height:100%; overflow:visible; }
  .lc-segment{ cursor:pointer; transition:filter .15s, opacity .15s; }
  .lc-segment:hover{ filter:brightness(1.18); }
  .lc-segment.lc-active{ filter:brightness(1.28) saturate(1.1); }
  .lc-segment:focus-visible, .lc-quad-label:focus-visible{ outline:2px solid var(--goldBright); outline-offset:2px; }
  .lc-band-label{ position:absolute; font-family:var(--mono); font-size:12px; font-weight:700; color:#0A1728;
    transform:translate(-50%,-50%); pointer-events:none; text-shadow:0 1px 0 rgba(255,255,255,0.18); letter-spacing:.02em; }
  .lc-quad-label{ position:absolute; width:104px; transform:translate(-50%,-50%); text-align:center; cursor:pointer;
    padding:5px 6px; border-radius:8px; transition:.15s; }
  .lc-quad-label:hover{ background:rgba(201,162,75,0.10); }
  .lc-quad-label.lc-active{ background:rgba(201,162,75,0.14); box-shadow:0 0 0 1px var(--goldDim); }
  .lc-quad-label .name{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text); line-height:1.25; }
  .lc-quad-label .sub{ font-size:9.5px; color:var(--textMuted); margin-top:2px; }
  .lc-center{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:118px; height:118px;
    border-radius:50%; background:var(--bgPanel); border:1px solid var(--goldDim); display:flex; flex-direction:column;
    align-items:center; justify-content:center; box-shadow:inset 0 0 22px rgba(0,0,0,0.35); text-align:center; }
  .lc-center .age{ font-family:var(--mono); font-size:28px; font-weight:700; color:var(--goldBright); line-height:1; }
  .lc-center .lbl{ font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:var(--textFaint); margin-top:4px; }
  .lc-pointer-wrap{ position:absolute; left:50%; top:50%; width:0; height:0; }
  .lc-pointer{ position:absolute; left:0; top:0; width:2px; height:150px; margin-left:-1px; margin-top:-150px;
    transform-origin:50% 150px; transition:transform 1.15s cubic-bezier(.22,1.1,.32,1); }
  .lc-pointer .tip{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:7px solid transparent; border-right:7px solid transparent; border-bottom:14px solid var(--goldBright);
    filter:drop-shadow(0 0 6px rgba(232,200,119,0.75)); }
  .lc-pointer .shaft{ position:absolute; top:14px; left:50%; width:2px; height:calc(100% - 14px); transform:translateX(-50%);
    background:linear-gradient(to bottom, var(--goldBright), var(--goldDim) 85%); opacity:.85; }
  .lc-pointer .pulse{ position:absolute; top:-4px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%;
    background:var(--goldBright); animation:geoPulse 2s ease-out infinite; }
  .lc-age-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
  .lc-age-row .input{ width:76px; margin-top:0; text-align:center; }
  .lc-stagebar{ display:flex; width:100%; border-radius:8px; overflow:hidden; height:8px; margin-top:10px; border:1px solid var(--line); }
  .lc-stagebar span{ height:100%; }
  .lc-panel{ border-radius:10px; padding:14px 16px; background:var(--bgPanelAlt); border:1px solid var(--line); }
  .lc-panel + .lc-panel{ margin-top:12px; }
  .lc-panel .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:7px; flex-shrink:0; }
  .lc-chip{ display:inline-flex; align-items:center; font-size:10.5px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    padding:3px 9px; border-radius:20px; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="app">
  <div class="header">
    <div class="header-inner">
      <div class="eyebrow-top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>Special Risks &amp; Crisis Response Underwriting</span>
      </div>
      <h1>Kidnap &amp; Ransom Exposure &amp; Underwriting Intelligence</h1>
      <p class="subtitle" id="subtitle-line"></p>
    </div>
    <button class="presenter-toggle-btn" id="presenter-toggle-btn">Presenter Mode</button>
  </div>

  <div class="tabs">
    <div class="tabs-inner" id="tabs-inner"></div>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
/* ======================================================================
   DESIGN TOKENS
====================================================================== */
const T = {
  bg:"#0A1728", bgPanel:"#0F2038", bgPanelAlt:"#13253F",
  line:"#233A57", lineSoft:"#1A2E4A",
  gold:"#C9A24B", goldBright:"#E8C877", goldDim:"#8A7238",
  text:"#EDE8DA", textMuted:"#8FA2BD", textFaint:"#5C7091",
  low:"#4C9A6A", moderate:"#D6A537", high:"#D97A34", critical:"#C0473F",
};

function bandForScore(score){
  if(score<=30) return {label:"Low", color:T.low};
  if(score<=60) return {label:"Moderate", color:T.moderate};
  if(score<=80) return {label:"High", color:T.high};
  return {label:"Critical", color:T.critical};

/* ======================================================================
   SCORING ENGINE
====================================================================== */
function computeScore({protectionDetail, crisisResponse, heat, travelTracking, priorIncidents, sectorRisk, travelFrequency, regionInstability}){
  const protectionSub = protectionDetail ? 0 : 100;
  const crisisSub = crisisResponse ? 0 : 100;
  const heatSub = heat==="Yes" ? 0 : heat==="Partial" ? 50 : 100;
  const trackingSub = travelTracking ? 0 : 100;
  const incidentSub = priorIncidents===0 ? 0 : priorIncidents===1 ? 60 : 100;
  const sectorSub = (sectorRisk/15)*100;
  const freqSub = (travelFrequency/10)*100;
  const instabilitySub = (regionInstability/10)*100;
  const raw = WEIGHTS.protectionDetail*protectionSub + WEIGHTS.crisisResponse*crisisSub + WEIGHTS.heat*heatSub +
    WEIGHTS.travelTracking*trackingSub + WEIGHTS.priorIncidents*incidentSub + WEIGHTS.sectorRisk*sectorSub +
    WEIGHTS.travelFrequency*freqSub + WEIGHTS.regionInstability*instabilitySub;
  return Math.round(raw);
}
function computePremium(score, bandMult){ return Math.round(bandMult*(2200+320*score)); }
function computeRetention(score, bandLabel){
  const bandBase = {"Up to £1m":5000,"£1m–£5m":15000,"£5m–£15m":50000,"£15m+":150000}[bandLabel];
  const band = bandForScore(score).label;
  const mult = {Low:1, Moderate:1.5, High:2.5, Critical:4}[band];
  return Math.round(bandBase*mult);
}
function fmtGBP(n){ return "£" + Math.round(n).toLocaleString("en-GB"); }

/* ======================================================================
   SYNTHETIC PORTFOLIO (seeded)
====================================================================== */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed>>>15), 1 | seed);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}
function buildPortfolio(){
  const rand = mulberry32(41203);
  const policies = [];
  for(let i=0;i<100;i++){
    const sector = SECTORS[Math.floor(rand()*SECTORS.length)];
    const band = LIMIT_BANDS[Math.floor(rand()*LIMIT_BANDS.length)];
    const protectionDetail = rand()<0.45;
    const crisisResponse = rand()<0.55;
    const hRoll = rand();
    const heat = hRoll<0.30 ? "No" : hRoll<0.60 ? "Partial" : "Yes";
    const travelTracking = rand()<0.50;
    const iRoll = rand();
    const priorIncidents = iRoll<0.85 ? 0 : iRoll<0.96 ? 1 : 2;
    const travelFrequency = Math.floor(rand()*11);
    const regionInstability = Math.floor(rand()*11);
    // Client age — skewed toward the peak-earning 41–55 consolidation band,
    // since that's where K&R-relevant wealth and public profile concentrate,
    // while still covering the full 22–82 span.
    const ageRoll = rand();
    const age = ageRoll<0.20 ? 22+Math.floor(rand()*19)   // 22–40 accumulation
              : ageRoll<0.55 ? 41+Math.floor(rand()*15)   // 41–55 consolidation
              : ageRoll<0.82 ? 56+Math.floor(rand()*10)   // 56–65 spending
              : 66+Math.floor(rand()*17);                 // 66–82 gifting/legacy
    const score = computeScore({protectionDetail, crisisResponse, heat, travelTracking, priorIncidents,
      sectorRisk:sector.sectorRisk, travelFrequency, regionInstability});
    const premium = computePremium(score, band.mult);
    const claimProb = Math.min(0.35, (score/100)*sector.incidentProb*1.5);
    const hadClaim = rand()<claimProb;
    const severity = hadClaim ? Math.round(sector.avgRansomBase*(0.4+(score/100)*1.3)*(0.6+rand()*0.8)) : 0;
    policies.push({ id:i+1, sector:sector.name, band:band.label, protectionDetail, crisisResponse, heat,
      travelTracking, priorIncidents, travelFrequency, regionInstability, age, score, premium, hadClaim, severity });
  }
  return policies;
}

function heatColor(value, min, max){
  const t = max>min ? (value-min)/(max-min) : 0;
  const stops = [[76,154,106],[214,165,55],[217,122,52],[192,71,63]];
  const idx = Math.min(stops.length-2, Math.floor(t*(stops.length-1)));
  const localT = t*(stops.length-1) - idx;
  const c1 = stops[idx], c2 = stops[idx+1];
  const c = c1.map((v,i)=>Math.round(v+(c2[i]-v)*localT));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function riskGaugeSVG(score){
  const band = bandForScore(score);
  const angle = -90 + (score/100)*180;
  const r = 70, cx = 90, cy = 90;
  const toXY = (deg)=>{ const rad = deg*Math.PI/180; return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)]; };
  const segs = [
    {from:-90, to:-36, color:T.low}, {from:-36, to:18, color:T.moderate},
    {from:18, to:54, color:T.high}, {from:54, to:90, color:T.critical},
  ];
  const arcPath = (from,to)=>{ const [x1,y1]=toXY(from), [x2,y2]=toXY(to); return `M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`; };
  const [nx, ny] = toXY(angle);
  const arcs = segs.map(s=>`<path d="${arcPath(s.from,s.to)}" stroke="${s.color}" stroke-width="10" fill="none" opacity="0.85"/>`).join("");
  return `
  <div style="display:flex;flex-direction:column;align-items:center;">
    <svg width="180" height="112" viewBox="0 0 180 112">
      ${arcs}
      <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${T.goldBright}" stroke-width="2.5"/>
      <circle cx="${cx}" cy="${cy}" r="5" fill="${T.goldBright}"/>
    </svg>
    <div style="font-family:var(--mono);font-size:28px;font-weight:600;margin-top:-8px;color:${band.color};">${score}</div>
    <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px;color:${band.color};">${band.label} Risk</div>
  </div>`;
}

function deltaPillHTML(value, reference, goodDirection="down", decimals=0){
  const diff = value - reference;
  const pct = reference !== 0 ? (diff/reference)*100 : 0;
  const flat = Math.abs(diff) < 0.5;
  const better = goodDirection==="down" ? diff<0 : diff>0;
  const color = flat ? T.textFaint : better ? T.low : T.critical;
  const ic = flat ? "minus" : diff>0 ? "trend-up" : "trend-down";
  const txt = flat ? "on par" : `${diff>0?"+":""}${pct.toFixed(decimals)}%`;
  return `<span class="pill" style="color:${color};">${icon(ic,12,color)}${txt}</span>`;
}

function trafficLightHTML(level){
  const color = level==="Low" ? T.low : level==="Moderate" ? T.moderate : T.critical;
  return `<span class="traffic" style="color:${color};"><span class="dot" style="background:${color};"></span>${level} Exposure</span>`;
}

function computeAgg(portfolio){
  const n = portfolio.length;
  const avgScore = portfolio.reduce((a,c)=>a+c.score,0)/n;
  const avgPremium = portfolio.reduce((a,c)=>a+c.premium,0)/n;
  const claimsCos = portfolio.filter(c=>c.hadClaim);
  const totalPremium = portfolio.reduce((a,c)=>a+c.premium,0);
  const totalIncurred = claimsCos.reduce((a,c)=>a+c.severity,0);
  const lossRatio = totalPremium ? totalIncurred/totalPremium : 0;
  const avgIncidentCost = claimsCos.length ? claimsCos.reduce((a,c)=>a+c.severity,0)/claimsCos.length : 0;

  const bySector = SECTORS.map(s=>{
    const cos = portfolio.filter(c=>c.sector===s.name);
    const avgS = cos.length ? cos.reduce((a,c)=>a+c.score,0)/cos.length : 0;
    const avgP = cos.length ? cos.reduce((a,c)=>a+c.premium,0)/cos.length : 0;
    const claims = cos.filter(c=>c.hadClaim);
    const freq = cos.length ? claims.length/cos.length : 0;
    const sev = claims.length ? claims.reduce((a,c)=>a+c.severity,0)/claims.length : 0;
    return { sector:s.name, avgScore:Math.round(avgS), avgScoreExact:avgS, avgPremium:avgP, freq, sev, count:cos.length, incidentProb:s.incidentProb };
  }).sort((a,b)=>b.avgScore-a.avgScore);

  const vulnCounts = [
    { label:"No Protection Detail", count:portfolio.filter(c=>!c.protectionDetail).length },
    { label:"No Crisis Response Retainer", count:portfolio.filter(c=>!c.crisisResponse).length },
    { label:"No HEAT Training", count:portfolio.filter(c=>c.heat!=="Yes").length },
    { label:"No Travel Tracking", count:portfolio.filter(c=>!c.travelTracking).length },
    { label:"Prior Incident(s)", count:portfolio.filter(c=>c.priorIncidents>0).length },
    { label:"High Travel Frequency", count:portfolio.filter(c=>c.travelFrequency>=6).length },
  ].sort((a,b)=>b.count-a.count);

  const bandCounts = ["Low","Moderate","High","Critical"].map(label=>({
    label, count: portfolio.filter(c=>bandForScore(c.score).label===label).length,
    color: {Low:T.low, Moderate:T.moderate, High:T.high, Critical:T.critical}[label],
  }));

  return { avgScore, avgPremium, avgIncidentCost, bySector, vulnCounts, bandCounts, totalClaims:claimsCos.length, lossRatio, totalPremium };
}

}

function lcStageForAge(age){
  return LC_STAGES.find(s=>age>=s.ageMin && age<=s.ageMax) || (age<18 ? LC_STAGES[0] : LC_STAGES[LC_STAGES.length-1]);
}
function lcAngleForAge(age){
  const st = lcStageForAge(age);
  const frac = Math.min(1, Math.max(0, (age - st.ageMin) / (st.ageMax - st.ageMin)));
  return st.angleStart + frac * (st.angleEnd - st.angleStart);
}
function lcPolar(cx, cy, r, angleDeg){
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
}
function lcDonutPath(cx, cy, rOuter, rInner, startAngle, endAngle){
  const oS = lcPolar(cx,cy,rOuter,startAngle), oE = lcPolar(cx,cy,rOuter,endAngle);
  const iS = lcPolar(cx,cy,rInner,startAngle), iE = lcPolar(cx,cy,rInner,endAngle);
  return `M ${oS.x.toFixed(2)} ${oS.y.toFixed(2)} A ${rOuter} ${rOuter} 0 0 1 ${oE.x.toFixed(2)} ${oE.y.toFixed(2)} L ${iE.x.toFixed(2)} ${iE.y.toFixed(2)} A ${rInner} ${rInner} 0 0 0 ${iS.x.toFixed(2)} ${iS.y.toFixed(2)} Z`;
}

function lcWheelSVG(){
  const cx=150, cy=150, rOuter=140, rInner=88;
  const segs = LC_STAGES.map((s,i)=>`<path class="lc-segment" data-idx="${i}" tabindex="0" role="button" aria-label="Jump wheel to ${s.name}, ${s.band} years" d="${lcDonutPath(cx,cy,rOuter,rInner,s.angleStart,s.angleEnd)}" style="fill:${s.color};stroke:#0A1728;stroke-width:2;"></path>`).join("");
  const bandLabels = LC_STAGES.map(s=>{
    const mid = (s.angleStart+s.angleEnd)/2;
    const p = lcPolar(cx,cy,(rOuter+rInner)/2,mid);
    return `<div class="lc-band-label" style="left:${p.x}px;top:${p.y}px;">${s.band}</div>`;
  }).join("");
  return `<svg viewBox="0 0 300 300">${segs}</svg>${bandLabels}`;
}

function lcQuadLabelsHTML(activeIdx){
  const cx=150, cy=150, r=195;
  return LC_STAGES.map((s,i)=>{
    const mid=(s.angleStart+s.angleEnd)/2;
    const p=lcPolar(cx,cy,r,mid);
    return `<div class="lc-quad-label${i===activeIdx?" lc-active":""}" data-idx="${i}" tabindex="0" role="button" aria-label="Jump wheel to ${s.name}, ${s.band} years" style="left:${p.x}px;top:${p.y}px;">
      <div class="name" style="color:${s.color};">${s.name}</div>
      <div class="sub">${s.band} yrs</div>
    </div>`;
  }).join("");
}

function lcSpinTo(age){
  age = Math.max(18, Math.min(100, Math.round(age)));
  state.lifecycle.age = age;
  const target = lcAngleForAge(age);
  const prev = state.lifecycle.totalRotation;
  const prevMod = ((prev % 360) + 360) % 360;
  let delta = target - prevMod;
  if(delta < 0) delta += 360;
  const flourish = state.lifecycle.ready ? 720 : 0; // extra full spins after the first render
  state.lifecycle.totalRotation = prev + delta + flourish;
  state.lifecycle.ready = true;
  lcUpdateDOM();
}

/* ======================================================================
   VALUE-LABELS CHART PLUGIN — draws the numeric value directly on/near
   each bar so charts read cleanly in a screenshot or slide without a
   live tooltip. Opt in per-chart via options.plugins.valueLabels.
====================================================================== */
Chart.register({
  id: "valueLabels",
  afterDatasetsDraw(chart){
    const opts = chart.options.plugins && chart.options.plugins.valueLabels;
    if(!opts || !opts.enabled) return;
    const { ctx } = chart;
    const horizontal = chart.options.indexAxis === "y";
    chart.data.datasets.forEach((dataset, di)=>{
      const meta = chart.getDatasetMeta(di);
      if(meta.hidden) return;
      meta.data.forEach((el, i)=>{
        const raw = dataset.data[i];
        const text = opts.formatter ? String(opts.formatter(raw, i)) : String(raw);
        ctx.save();
        ctx.fillStyle = opts.color || T.text;
        ctx.font = "600 11px " + (opts.font || "system-ui, sans-serif");
        if(horizontal){
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(text, el.x + 6, el.y);
        } else {
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(text, el.x, el.y - 4);
        }
        ctx.restore();
      });
    });
  },
});

/* ======================================================================
   SIMULATOR TAB
   Perf note: only the initial call per tab-visit does a full innerHTML
   build. Every slider/toggle/select change after that patches just the
   handful of DOM nodes whose values actually changed (gauge, premium,
   retention, benchmark pill, recommendations, exclusions) instead of
   re-rendering + re-binding the whole tab on every input/drag event.
====================================================================== */
function computeSimDerived(sim){
  const sector = SECTORS[sim.sectorIdx];
  const band = LIMIT_BANDS[sim.bandIdx];
  const score = computeScore({ protectionDetail:sim.protectionDetail, crisisResponse:sim.crisisResponse, heat:sim.heat,
    travelTracking:sim.travelTracking, priorIncidents:sim.priorIncidents, sectorRisk:sector.sectorRisk,
    travelFrequency:sim.travelFrequency, regionInstability:sim.regionInstability });
  const premium = computePremium(score, band.mult);
  const retention = computeRetention(score, band.label);
  const sectorBenchmark = agg.bySector.find(s=>s.sector===sector.name);

  const recommendations = [];
  if(!sim.protectionDetail) recommendations.push("Engage a licensed close-protection detail for travel to elevated-risk destinations.");
  if(!sim.crisisResponse) recommendations.push("Secure a 24/7 crisis response and negotiation retainer with an accredited response consultancy.");
  if(sim.heat!=="Yes") recommendations.push("Mandate Hostile Environment Awareness Training (HEAT) for all travelling personnel.");
  if(!sim.travelTracking) recommendations.push("Implement real-time travel tracking with defined check-in and proof-of-life protocols.");
  if(sim.priorIncidents>0) recommendations.push("Complete a post-incident review and update the crisis management plan following prior incident(s).");
  if(sim.travelFrequency>=6) recommendations.push("Reduce discretionary travel to high-risk destinations or add pre-deployment risk briefings.");
  if(sim.regionInstability>=6) recommendations.push("Increase local security liaison and vetted ground support in politically volatile destinations.");
  if(recommendations.length===0) recommendations.push("Maintain current protocols; schedule routine crisis management plan tabletop exercises.");

  const exclusions = [];
  if(!sim.crisisResponse) exclusions.push("Response cost coinsurance of 20% pending engagement of an approved crisis response provider.");
  if(!sim.protectionDetail && sim.priorIncidents>0) exclusions.push("Prior-incident exclusion until an accredited close-protection detail is confirmed for future travel.");
  if(sim.regionInstability>=8) exclusions.push("Named-country exclusion or war/political violence sub-limit for destinations rated Extreme.");
  if(exclusions.length===0) exclusions.push("No additional exclusions recommended beyond standard policy wording.");

  return { sector, band, score, premium, retention, sectorBenchmark, recommendations, exclusions };
}

function renderPortfolio(){
  let rows = portfolio;
  if(state.pSectorFilter!=="All") rows = rows.filter(c=>c.sector===state.pSectorFilter);
  if(state.pStageFilter!=="All") rows = rows.filter(c=>lcStageForAge(c.age).key===state.pStageFilter);
  if(state.pQuery.trim()){
    const q = state.pQuery.trim().toLowerCase();
    rows = rows.filter(c=>String(c.id).includes(q) || c.sector.toLowerCase().includes(q));
  }
  const dir = state.pSortDir==="desc" ? -1 : 1;
  rows = [...rows].sort((a,b)=>(a[state.pSortKey]>b[state.pSortKey]?1:a[state.pSortKey]<b[state.pSortKey]?-1:0)*dir);

function miniStat(label, ok, value){
  const color = value!==undefined && value!==null ? T.text : ok ? T.low : T.critical;

  return `<div class="ministat"><div class="lbl">${label}</div><div class="val" style="color:${color}">${display}</div></div>`;
}

function projectPoint(lon, lat, width, height){
  const x = (lon + 180) / 360 * width;
  const y = (90 - lat) / 180 * height;
  return [x, y];
}

function landmassPathD(points, width, height){
  return points.map((p, i)=>{
    const [x, y] = projectPoint(p[0], p[1], width, height);
    return (i===0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ") + " Z";
}

function initGeoMap(svgId="geo-svg", tooltipId="geo-tooltip", wrapId="geo-map-wrap", opts={}){
  const svgEl = document.getElementById(svgId);
  if(!svgEl) return;
  const width = 960, height = 500;
  const NS = "http://www.w3.org/2000/svg";
  const compact = !!opts.compact;

  while(svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

  // graticule (lightweight, every 30deg)
  const gratG = document.createElementNS(NS, "g");
  for(let lon=-180; lon<=180; lon+=30){
    const [x1] = projectPoint(lon, 90, width, height);
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", 0);
    line.setAttribute("x2", x1); line.setAttribute("y2", height);
    line.setAttribute("stroke", T.lineSoft); line.setAttribute("stroke-width", 0.4); line.setAttribute("opacity", 0.35);
    gratG.appendChild(line);
  }
  for(let lat=-60; lat<=60; lat+=30){
    const [,y1] = projectPoint(0, lat, width, height);
    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", 0); line.setAttribute("y1", y1);
    line.setAttribute("x2", width); line.setAttribute("y2", y1);
    line.setAttribute("stroke", T.lineSoft); line.setAttribute("stroke-width", 0.4); line.setAttribute("opacity", 0.35);
    gratG.appendChild(line);
  }
  svgEl.appendChild(gratG);

  // landmasses
  const landG = document.createElementNS(NS, "g");
  GEO_LANDMASSES.forEach(points=>{
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", landmassPathD(points, width, height));
    path.setAttribute("fill", T.bgPanelAlt);
    path.setAttribute("stroke", T.line);
    path.setAttribute("stroke-width", 0.8);
    path.setAttribute("stroke-linejoin", "round");
    landG.appendChild(path);
  });
  svgEl.appendChild(landG);

  // hotspot markers
  const markerG = document.createElementNS(NS, "g");
  const tooltip = document.getElementById(tooltipId);
  const wrap = document.getElementById(wrapId);

  GEO_HOTSPOTS.forEach((h, i)=>{
    const [x, y] = projectPoint(h.lon, h.lat, width, height);
    const inten = geoIntensity(h.sector);
    const band = bandForScore(inten);
    const r = (compact ? 2.2 : 3) + (inten/100)*(compact ? 3.5 : 5);

    const ring = document.createElementNS(NS, "circle");
    ring.setAttribute("cx", x); ring.setAttribute("cy", y); ring.setAttribute("r", r);
    ring.setAttribute("fill", "none"); ring.setAttribute("stroke", band.color); ring.setAttribute("stroke-width", 1.4);
    ring.setAttribute("class", "geo-pulse-ring");
    ring.style.animationDelay = (i*0.3) + "s";
    markerG.appendChild(ring);

    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("r", r*0.55);
    dot.setAttribute("fill", band.color); dot.setAttribute("stroke", T.bg); dot.setAttribute("stroke-width", 0.8);
    dot.setAttribute("class", "geo-marker-dot");
    dot.style.animationDelay = (i*0.3) + "s";
    if(tooltip && wrap){
      dot.style.cursor = "pointer";
      dot.addEventListener("mouseenter", ()=>{
        tooltip.style.opacity = 1;
        tooltip.innerHTML = `<strong>${h.name}</strong><br><span style="color:${T.textMuted}">${h.sector}</span><br>${h.note}<br><span style="color:${band.color};font-weight:600;">${band.label} exposure</span>`;
      });
      dot.addEventListener("mousemove", (event)=>{
        const rect = wrap.getBoundingClientRect();
        tooltip.style.left = Math.min(rect.width - 230, event.clientX - rect.left + 14) + "px";
        tooltip.style.top = (event.clientY - rect.top + 10) + "px";
      });
      dot.addEventListener("mouseleave", ()=>{ tooltip.style.opacity = 0; });
    }
    markerG.appendChild(dot);
  });
  svgEl.appendChild(markerG);
}

function startGeoFeed(){
  if(geoLogInterval) clearInterval(geoLogInterval);
  const feedEl = document.getElementById("geo-feed");
  const verbs = [
    "Elevated chatter noted near", "Advisory review flagged", "Pattern-of-life shift observed near",
    "Local reporting referenced activity near", "Routine monitoring update for", "Travel advisory level unchanged for",
    "Security posture reassessed for",
  ];
  let tSec = 0;
  function pushEntry(){
    const el = document.getElementById("geo-feed");
    if(!el){ clearInterval(geoLogInterval); geoLogInterval = null; return; }
    const h = GEO_HOTSPOTS[Math.floor(Math.random()*GEO_HOTSPOTS.length)];
    const band = bandForScore(geoIntensity(h.sector));
    const verb = verbs[Math.floor(Math.random()*verbs.length)];
    tSec += Math.floor(Math.random()*40) + 10;
    const row = document.createElement("div");
    row.className = "minirow geo-feed-row";
    row.style.fontSize = "11px";
    row.innerHTML = `<span style="display:flex;align-items:center;gap:6px;">
        <span class="geo-dot" style="background:${band.color}"></span>
        ${verb} <strong style="margin:0 3px;color:${T.text};">${h.name}</strong>
        <span class="faint">(${h.sector})</span>
      </span>
      <span class="mono faint" style="flex-shrink:0;">T-${tSec}s</span>`;
    el.prepend(row);
    while(el.children.length > 12) el.removeChild(el.lastChild);
  }
  pushEntry();
  geoLogInterval = setInterval(pushEntry, 2600);
}

/* ======================================================================
   AI RISK ADVISOR — fully offline / no external API
   A rule-based conversational agent: written knowledge + this
   dashboard's own real scoring engine (SECTORS, computeScore,
   computePremium, computeRetention) power its answers. No network
   call, no API key, no live data feed — everything runs in this file.
   Chat history lives in `state.chat.messages` for the life of the
   page only (resets on refresh — there's no database).
====================================================================== */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

// Very small markdown-lite renderer: **bold**, "- " bullet lists, paragraphs.
function mdLite(raw){
  const escaped = escapeHtml(raw).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const blocks = escaped.split(/\n\s*\n/);
  return blocks.map(block=>{
    const lines = block.split("\n").map(l=>l.trim()).filter(Boolean);
    if(lines.length && lines.every(l=>/^[-•]\s+/.test(l))){
      return `<ul>${lines.map(l=>`<li>${l.replace(/^[-•]\s+/, "")}</li>`).join("")}</ul>`;
    }
    return `<p>${lines.join("<br>")}</p>`;
  }).join("");
}

function runScenarioCalculator(q){
  const sector = findSectorInText(q) || SECTORS[0].name;
  const s = SECTORS.find(x=>x.name===sector);

  const protectionDetail = /protection detail|close protection|bodyguard|cp team/.test(q) && !/no protection|without protection/.test(q);
  const crisisResponse = /(crisis response|retainer|response consultant|response firm)/.test(q) && !/no crisis|without.*retainer/.test(q);
  let heat = "No";
  if(/heat train|hostile environment/.test(q) && !/no heat|untrained|without.*train/.test(q)) heat = "Yes";
  else if(/partial.*train|some training/.test(q)) heat = "Partial";
  const travelTracking = /(travel track|gps monitor|tracked)/.test(q) && !/no track|untracked/.test(q);
  let priorIncidents = 0;
  if(/multiple incidents|repeat incident|two incidents|several incidents/.test(q)) priorIncidents = 2;
  else if(/prior incident|one incident|previous incident|past incident/.test(q)) priorIncidents = 1;
  let travelFrequency = 5;
  if(/frequent travel|constant travel|travels? (a lot|often|weekly)/.test(q)) travelFrequency = 8;
  else if(/occasional travel|rarely travels?|infrequent travel/.test(q)) travelFrequency = 3;
  let regionInstability = 5;
  if(/conflict zone|unstable|warzone|war zone|high instability/.test(q)) regionInstability = 9;
  else if(/stable region|low instability|safe region/.test(q)) regionInstability = 2;

  let bandIdx = 1;
  if(/15m\+|over 15m|above 15/.test(q)) bandIdx = 3;
  else if(/5m|5-15|five to fifteen/.test(q)) bandIdx = 2;
  else if(/up to 1m|under 1m|below 1m/.test(q)) bandIdx = 0;
  const band = LIMIT_BANDS[bandIdx];

  const score = computeScore({ protectionDetail, crisisResponse, heat, travelTracking, priorIncidents, sectorRisk:s.sectorRisk, travelFrequency, regionInstability });
  const scoreBand = bandForScore(score);
  const premium = computePremium(score, band.mult);
  const retention = computeRetention(score, band.label);

  const assumptions = [
    `sector: **${sector}**`,
    `limit band: **${band.label}**`,
    `protection detail: ${protectionDetail ? "in place" : "assumed absent"}`,
    `crisis-response retainer: ${crisisResponse ? "in place" : "assumed absent"}`,
    `HEAT training: ${heat}`,
    `travel tracking: ${travelTracking ? "in place" : "assumed absent"}`,
    `prior incidents: ${priorIncidents}`,
    `travel frequency: ${travelFrequency}/10, regional instability: ${regionInstability}/10`,
  ];

  return { sector, score, scoreBand, premium, retention, band, assumptions };
}

function buildScenarioReply(q, mode){
  const r = runScenarioCalculator(q);
  const heading = mode==="simple"
    ? `Here's a rough estimate, based on what you told me and a few sensible assumptions where you didn't:`
    : `Running that through the same engine the Simulator uses:`;
  const numbers = mode==="simple"
    ? `- Risk score: **${r.score}/100** (${r.scoreBand.label} band)\n- Estimated premium: **${fmtGBP(r.premium)}**\n- Suggested retention: **${fmtGBP(r.retention)}**`
    : `- Score: **${r.score}/100**, band **${r.scoreBand.label}**\n- Indicative premium: **${fmtGBP(r.premium)}** (limit band ${r.band.label}, multiplier x${r.band.mult})\n- Suggested retention: **${fmtGBP(r.retention)}**`;
  return `${heading}\n\n${numbers}\n\nAssumptions I used:\n${r.assumptions.map(a=>`- ${a}`).join("\n")}\n\nThis is a rough read, not a quote — open the **Underwriting Simulator** tab to dial in every input precisely and see the full breakdown, benchmark and recommendations.`;
}

// A keyword "hits" a query either as an exact substring (strong signal) or,
// failing that, if every one of its significant (>2-letter) words shows up
// somewhere in the query regardless of order/phrasing — this is what catches
// paraphrases of the suggestion chips (e.g. "scores a risk" vs "score calculated").
function keywordHits(keyword, q, qWords){
  if(q.includes(keyword)) return 1;
  const kWords = keyword.split(/\s+/).filter(w=>w.length>2);
  if(kWords.length>=2 && kWords.every(w=>qWords.has(w))) return 0.75;
  return 0;
}
function findBestTopic(q){
  const qWords = new Set(q.split(/[^a-z0-9&]+/i).filter(Boolean));
  let best = null, bestScore = 0;
  for(const topic of KB_TOPICS){
    const score = topic.keywords.reduce((sum,k)=>sum+keywordHits(k,q,qWords), 0);
    if(score>bestScore){ bestScore = score; best = topic; }
  }
  return bestScore>0 ? best : null;
}

function generateAdvisorReply(rawText){
  const q = rawText.toLowerCase().trim();
  const mode = state.chat.mode;
  const maybeHumour = Math.random()<0.35 ? `\n\n${HUMOUR_LINES[Math.floor(Math.random()*HUMOUR_LINES.length)]}` : "";
  let newsQuery = null;

  if(GREETING_RE.test(q) && q.length<25){
    return { content:"Hello. What can I help you get your head around today — a tab, a sector, a region, or just the shape of this whole market?", newsQuery };
  }
  if(THANKS_RE.test(q)){
    return { content:"Any time. That's what I'm here for.", newsQuery };
  }
  if(HOW_ARE_YOU_RE.test(q)){
    return { content: SMALL_TALK_LINES[Math.floor(Math.random()*SMALL_TALK_LINES.length)] + " Anyway — what's on your desk?", newsQuery };
  }
  if(ARE_YOU_REAL_RE.test(q)){
    return { content:"Honest answer, since you asked directly: I'm not a live AI model — no external service, no internet connection. I'm a rule-based assistant built into this dashboard, matching what you ask against knowledge written into the page and this dashboard's own real scoring engine for numbers. The personality's genuine effort, but I won't pretend to be something I'm not.", newsQuery };
  }
  if(JOKE_RE.test(q)){
    return { content: JOKES[Math.floor(Math.random()*JOKES.length)] + maybeHumour, newsQuery };
  }

  const hotspot = findHotspotInText(q);
  if(hotspot){
    const key = Object.keys(HOTSPOT_DRIVER).find(k=>hotspot.name.toLowerCase().includes(k.toLowerCase()));
    const driver = key ? HOTSPOT_DRIVER[key] : "a combination of weak local security capacity and criminal or armed-group activity";
    newsQuery = `${hotspot.name.split(",")[0]} security situation`;
    const content = mode==="simple"
      ? `${hotspot.name} shows up on the Geo tab tied to the ${hotspot.sector} sector. In short: ${hotspot.note} My take on the underlying "why" — it comes down to ${driver}.`
      : `${hotspot.name} is modelled here against the **${hotspot.sector}** sector. Dashboard note: ${hotspot.note} My analytical read on the driver: this pattern is consistent with ${driver}. Treat this as pattern-level reasoning, not a claim about any specific current incident.`;
    return { content, newsQuery };
  }

  if(SCENARIO_RE.test(q) && (findSectorInText(q) || /sector|client|risk/.test(q))){
    return { content: buildScenarioReply(q, mode) + maybeHumour, newsQuery };
  }

  const topic = findBestTopic(q);
  if(topic){
    const content = (mode==="simple" ? topic.simple : topic.technical) + maybeHumour;
    if(topic.id==="emerging-risk") newsQuery = "kidnap ransom risk news";
    if(topic.id==="world-events-2026") newsQuery = "kidnap ransom security risk news 2026";
    if(topic.id==="kr-market-2026") newsQuery = "kidnap ransom insurance market news";
    return { content, newsQuery };
  }

  return {
    content:"I didn't quite catch a clear topic in that one — I'm a rule-based advisor, not a free-ranging model, so I work best with a fairly direct question. Try one of the suggestions below, ask about a specific tab or sector, or describe a scenario (e.g. \"premium for a mining client with no HEAT training\") and I'll run it through the calculator.",
    newsQuery,
  };
}

}

function sendAdvisorMessage(text){
  state.chat.messages.push({ role:"user", content:text });
  state.chat.loading = true;
  renderChatMessages();

  // Small simulated "thinking" delay for a natural chat feel — everything
  // below runs locally, synchronously, with no network call of any kind.
  setTimeout(()=>{
    const { content, newsQuery } = generateAdvisorReply(text);
    state.chat.messages.push({ role:"assistant", content, newsQuery });
    state.chat.loading = false;
    renderChatMessages();
  }, 450 + Math.random()*500);
}

renderContent();

/* ======================================================================
   INTERACTIVE ANIMATED BACKGROUND
   A drifting intelligence-network of nodes and connecting lines that
   brightens and reorients near the cursor — a quiet nod to signal
   tracking / surveillance-network themes of the dashboard.

   Perf notes:
   - The animation loop is paused entirely when the tab/document is not
     visible (document.hidden), so it costs zero CPU/battery while the
     user is on another tab or the window is minimized.
   - Pairwise connection checks use a coarse spatial grid keyed to
     LINK_DIST, so each node only tests distance against neighbours in
     its own and adjacent cells instead of every other node on the
     canvas (avoids the O(n^2) full-pair scan every frame).
====================================================================== */
(function backgroundNetwork(){
  const canvas = document.getElementById("bg-canvas");
  const ctx = canvas.getContext("2d");
  let w, h, dpr;
  let nodes = [];
  let pulses = [];
  const mouse = { x:-9999, y:-9999, active:false };
  let t = 0;
  let rafId = null;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w*dpr; canvas.height = h*dpr;
    canvas.style.width = w+"px"; canvas.style.height = h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.max(32, Math.min(80, Math.round((w*h)/22000)));
    nodes = Array.from({length:count}, ()=>({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.3, vy: (Math.random()-0.5)*0.3,
      r: 1 + Math.random()*1.6,
      phase: Math.random()*Math.PI*2,
      wspeed: 0.0004 + Math.random()*0.0006,
      pulsePhase: Math.random()*Math.PI*2,
    }));
    pulses = [];
  }
  window.addEventListener("resize", resize);
  window.addEventListener("mousemove", (e)=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; });
  window.addEventListener("mouseleave", ()=>{ mouse.active=false; });
  window.addEventListener("touchmove", (e)=>{ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; mouse.active=true; } }, {passive:true});
  window.addEventListener("touchend", ()=>{ mouse.active=false; });

  const LINK_DIST = 155;
  const MOUSE_DIST = 220;

  // Spatial grid: bucket nodes into cells of size LINK_DIST so the
  // connection pass only compares each node against nodes in its own
  // and the 8 surrounding cells, instead of every node in the scene.
  function buildGrid(){
    const cell = LINK_DIST;
    const grid = new Map();
    const key = (cx,cy)=>cx+","+cy;
    for(const n of nodes){
      const cx = Math.floor(n.x/cell), cy = Math.floor(n.y/cell);
      const k = key(cx,cy);
      if(!grid.has(k)) grid.set(k, []);
      grid.get(k).push(n);
    }
    return { grid, cell, key };
  }

  function step(){
    t += 1;

    for(const n of nodes){
      // perpetual organic wander — a slowly-rotating force that never
      // fully decays, so the field is always drifting even at rest
      n.phase += n.wspeed;
      n.vx += Math.cos(n.phase) * 0.006;
      n.vy += Math.sin(n.phase*1.3) * 0.006;

      if(mouse.active){
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < MOUSE_DIST && dist > 0.01){
          const strength = 1 - dist/MOUSE_DIST;
          // gentle pull inward
          const pull = strength * 0.05;
          n.vx -= (dx/dist)*pull;
          n.vy -= (dy/dist)*pull;
          // tangential swirl around the cursor for a lively orbit feel
          const swirl = strength * 0.09;
          n.vx += (-dy/dist)*swirl;
          n.vy += (dx/dist)*swirl;
        }
      }

      // soft damping keeps speed bounded without ever fully stopping
      n.vx *= 0.978; n.vy *= 0.978;
      const speed = Math.sqrt(n.vx*n.vx+n.vy*n.vy);
      const maxSpeed = 0.9;
      if(speed > maxSpeed){ n.vx = (n.vx/speed)*maxSpeed; n.vy = (n.vy/speed)*maxSpeed; }

      n.x += n.vx; n.y += n.vy;
      if(n.x < -20) n.x = w+20; if(n.x > w+20) n.x = -20;
      if(n.y < -20) n.y = h+20; if(n.y > h+20) n.y = -20;
    }

    // occasionally launch a signal pulse along a currently-live connection
    if(Math.random() < 0.045 && nodes.length > 1){
      const a = nodes[Math.floor(Math.random()*nodes.length)];
      let best = null, bestDist = LINK_DIST;
      for(const b of nodes){
        if(b===a) continue;
        const d = Math.hypot(a.x-b.x, a.y-b.y);
        if(d < bestDist){ bestDist = d; best = b; }
      }
      if(best) pulses.push({ a, b:best, u:0, speed: 0.012 + Math.random()*0.012 });
    }
    pulses.forEach(p=>p.u += p.speed);
    pulses = pulses.filter(p=>p.u < 1);
  }

  function draw(){
    ctx.clearRect(0,0,w,h);

    // ambient slow-orbiting scan glow — keeps the field alive even
    // when the cursor is idle or off-screen
    const orbitR = Math.min(w,h) * 0.32;
    const ox = w/2 + Math.cos(t*0.0016) * orbitR;
    const oy = h/2 + Math.sin(t*0.0021) * orbitR * 0.7;
    const ambient = ctx.createRadialGradient(ox, oy, 0, ox, oy, 320);
    ambient.addColorStop(0, "rgba(201,162,75,0.055)");
    ambient.addColorStop(1, "rgba(201,162,75,0)");
    ctx.fillStyle = ambient;
    ctx.fillRect(0,0,w,h);

    // cursor glow
    if(mouse.active){
      const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 260);
      grad.addColorStop(0, "rgba(201,162,75,0.12)");
      grad.addColorStop(1, "rgba(201,162,75,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);
    }

    // connections — grid-accelerated so we only test nearby pairs
    const { grid, cell, key } = buildGrid();
    const seen = new Set(); // avoid drawing the same pair twice
    for(const n of nodes){
      const cx = Math.floor(n.x/cell), cy = Math.floor(n.y/cell);
      for(let ox=-1; ox<=1; ox++){
        for(let oy=-1; oy<=1; oy++){
          const bucket = grid.get(key(cx+ox, cy+oy));
          if(!bucket) continue;
          for(const other of bucket){
            if(other===n) continue;
            const dx = n.x-other.x, dy = n.y-other.y;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if(dist >= LINK_DIST) continue;
            const idKey = n===other ? null : (nodes.indexOf(n) < nodes.indexOf(other)
              ? nodes.indexOf(n)+"_"+nodes.indexOf(other)
              : nodes.indexOf(other)+"_"+nodes.indexOf(n));
            if(idKey===null || seen.has(idKey)) continue;
            seen.add(idKey);

            const a = n, b = other;
            const nearMouseA = mouse.active ? Math.max(0, 1 - Math.hypot(a.x-mouse.x, a.y-mouse.y)/260) : 0;
            const nearMouseB = mouse.active ? Math.max(0, 1 - Math.hypot(b.x-mouse.x, b.y-mouse.y)/260) : 0;
            const glow = Math.max(nearMouseA, nearMouseB);
            const shimmer = 0.85 + 0.15*Math.sin(t*0.03 + nodes.indexOf(a)*0.7 + nodes.indexOf(b)*0.3);
            const baseAlpha = (1 - dist/LINK_DIST) * 0.17 * shimmer;
            const alpha = baseAlpha + glow*0.30;
            ctx.strokeStyle = glow > 0.05
              ? `rgba(232,200,119,${Math.min(0.5, alpha)})`
              : `rgba(143,162,189,${Math.min(0.35, alpha)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
            ctx.stroke();
          }
        }
      }
    }

    // traveling signal pulses along live connections
    for(const p of pulses){
      const x = p.a.x + (p.b.x-p.a.x)*p.u;
      const y = p.a.y + (p.b.y-p.a.y)*p.u;
      const fade = Math.sin(Math.PI * p.u); // fades in and out along the path
      ctx.beginPath();
      ctx.arc(x, y, 1.8, 0, Math.PI*2);
      ctx.fillStyle = `rgba(232,200,119,${0.7*fade})`;
      ctx.fill();
    }

    // nodes — gentle breathing pulse so they never look frozen
    for(const n of nodes){
      const nearMouse = mouse.active ? Math.max(0, 1 - Math.hypot(n.x-mouse.x, n.y-mouse.y)/260) : 0;
      const breathe = 1 + 0.25*Math.sin(t*0.045 + n.pulsePhase);
      ctx.beginPath();
      ctx.arc(n.x, n.y, (n.r*breathe) + nearMouse*1.5, 0, Math.PI*2);
      ctx.fillStyle = nearMouse > 0.05 ? `rgba(232,200,119,${0.5+nearMouse*0.5})` : "rgba(143,162,189,0.5)";
      ctx.fill();
    }
  }

  function loop(){
    step(); draw();
    rafId = requestAnimationFrame(loop);
  }

  // Pause the whole animation loop when the tab isn't visible — no
  // point burning CPU/battery animating a canvas nobody can see.
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    } else if(!rafId){
      rafId = requestAnimationFrame(loop);
    }
  });

  resize();
  if(!document.hidden){ rafId = requestAnimationFrame(loop); }
})();
</script>
